<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Japón · Jaime + Marina · Oct 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,300;9..144,0,400;9..144,0,500;9..144,0,600;9..144,1,300;9..144,1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  :root {
    --paper: #F1E9D6;
    --paper-2: #E8DFC7;
    --ink: #1B1F2A;
    --persimmon: #C84A28;
    --moss: #5E6B3D;
    --border: #C4B99B;
    --border-strong: #A99D80;
    --muted: #6E6858;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.55;
  }
  .app {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: 100vh;
  }
  aside {
    background: var(--paper);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  aside::-webkit-scrollbar { width: 6px; }
  aside::-webkit-scrollbar-track { background: transparent; }
  aside::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  header.masthead {
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--border);
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-variation-settings: "opsz" 96;
    font-weight: 400;
    font-size: 28px;
    line-height: 1.0;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 10px;
  }
  h1 em {
    font-style: italic;
    color: var(--persimmon);
    font-weight: 300;
  }
  .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .meta span strong { color: var(--ink); font-weight: 500; }
  .countdown {
    margin-top: 4px;
    color: var(--persimmon) !important;
    font-weight: 500;
  }

  .leaves {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 450;
  }
  .leaf {
    position: absolute;
    top: -40px;
    opacity: 0;
    will-change: transform, opacity;
    animation: leafFall linear infinite;
  }
  @keyframes leafFall {
    0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
    8% { opacity: 0.8; }
    92% { opacity: 0.7; }
    100% { transform: translateY(110vh) translateX(var(--drift, 40px)) rotate(360deg); opacity: 0; }
  }

  .summary {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }
  .stat-value {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 500;
    line-height: 1;
    color: var(--ink);
    display: block;
  }
  .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 6px;
  }

  .timeline { padding: 4px 0 16px; flex: 1; }
  .section-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 14px 20px 8px;
  }

  .stop {
    position: relative;
    display: grid;
    grid-template-columns: 32px 1fr auto;
    gap: 10px;
    align-items: start;
    padding: 8px 20px;
    cursor: pointer;
    transition: background 0.15s;
    border-left: 3px solid transparent;
  }
  .stop:hover { background: var(--paper-2); }
  .stop.active {
    background: var(--paper-2);
    border-left-color: var(--persimmon);
  }
  .stop-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    padding-top: 2px;
  }
  .stop-body { min-width: 0; }
  .stop-name {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 16px;
    line-height: 1.2;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .stop-detail {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.02em;
  }
  .stop-nights {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    padding-top: 4px;
    text-align: right;
    white-space: nowrap;
  }
  .stop-nights strong {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 500;
    display: block;
    line-height: 1;
    color: var(--persimmon);
  }
  .stop-nights small {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
    display: block;
  }

  .leg {
    display: grid;
    grid-template-columns: 32px 1fr auto;
    gap: 10px;
    padding: 4px 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .leg-icon {
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--border-strong);
    font-size: 14px;
    line-height: 1;
  }

  .booked {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: var(--moss);
    color: var(--paper);
    padding: 2px 6px;
    border-radius: 2px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .pending {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border-strong);
  }


  .firework-particle {
    position: fixed;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    animation: fwBurst 1s ease-out forwards;
  }
  @keyframes fwBurst {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.3); opacity: 0; }
  }

  .foot {
    padding: 14px 20px 20px;
    border-top: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  main {
    position: relative;
    background: var(--paper-2);
  }
  #map { width: 100%; height: 100%; }
  .leaflet-container {
    background: #E8DFC7;
    font-family: 'Inter', sans-serif;
  }
  .leaflet-control-attribution {
    background: rgba(241, 233, 214, 0.85) !important;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px !important;
    color: var(--muted) !important;
  }
  .leaflet-control-attribution a { color: var(--persimmon) !important; }

  .marker-pin {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--persimmon);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 13px;
    border: 2px solid var(--paper);
    box-shadow: 0 2px 6px rgba(27, 31, 42, 0.35);
    cursor: pointer;
    transition: transform 0.15s;
  }
  .marker-pin:hover { transform: scale(1.15); }
  .marker-pin.active {
    background: var(--ink);
    transform: scale(1.2);
  }
  .marker-pin.optional {
    background: var(--paper);
    color: var(--muted);
    border: 2px dashed var(--border-strong);
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 15px;
    box-shadow: 0 1px 3px rgba(27, 31, 42, 0.2);
  }
  .marker-pin.optional:hover { border-color: var(--persimmon); color: var(--persimmon); }

  /* Fullscreen info panel */
  .info-overlay {
    position: absolute;
    inset: 0;
    background: rgba(241, 233, 214, 0.96);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 40px 56px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 500;
    overflow-y: auto;
    display: flex;
    align-items: flex-start;
  }
  .info-overlay.visible { opacity: 1; pointer-events: auto; }
  .info-content { position: relative; max-width: 560px; width: 100%; margin: 0 auto; }
  .info-close {
    position: absolute;
    top: -12px;
    right: -12px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border-strong);
    background: var(--paper);
    color: var(--ink);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .info-close:hover { background: var(--persimmon); color: var(--paper); border-color: var(--persimmon); }
  .info-cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 24px;
    padding: 11px 18px;
    background: var(--ink);
    color: var(--paper);
    text-decoration: none;
    border-radius: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    transition: background 0.15s, transform 0.15s;
  }
  .info-cta:hover { background: var(--persimmon); transform: translateY(-1px); }
  .info-cta::after { content: '↗'; font-size: 13px; }
  .info-cta-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .info-cta-row .info-cta { margin-top: 24px; }
  .info-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .info-title {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-variation-settings: "opsz" 144;
    font-weight: 400;
    font-size: 40px;
    line-height: 0.95;
    letter-spacing: -0.03em;
    color: var(--ink);
    margin-bottom: 16px;
  }
  .info-title em {
    font-style: italic;
    color: var(--persimmon);
    font-weight: 300;
  }
  .info-dates {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 18px;
    letter-spacing: 0.02em;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .info-notes {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 16px;
    line-height: 1.5;
    color: var(--muted);
    margin-bottom: 24px;
  }
  .info-todo-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--persimmon);
    margin-bottom: 12px;
  }
  .info-todo {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .info-todo li {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: var(--ink);
    line-height: 1.4;
    padding: 10px 0 10px 22px;
    position: relative;
    border-bottom: 1px dotted var(--border);
  }
  .info-todo li:last-child { border-bottom: none; }
  .info-todo li::before {
    content: '';
    position: absolute;
    left: 4px;
    top: 17px;
    width: 6px;
    height: 6px;
    background: var(--persimmon);
    border-radius: 50%;
  }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 40vh 60vh; }
    aside { border-right: none; border-bottom: 1px solid var(--border); order: 2; }
    main { order: 1; }
    h1 { font-size: 24px; }
    .info-title { font-size: 32px; }
    .info-todo li { font-size: 14px; }
    .info-overlay { padding: 28px 24px; }
    .leaves { display: none; }
  }
</style>
</head>
<body>

<div class="leaves" id="leaves"></div>

<div class="app">

    <header class="masthead">

      <div class="stat">

      <div class="stat">

  <main>
    <div id="map"></div>
    <div class="info-overlay" id="info-overlay">
      <div class="info-content" id="info-content"></div>
    </div>
  </main>
</div>

    { from: 2, to: 3, mode: "Bus a Mishima + shinkansen", time: "~3h30" },
    { from: 3, to: 4, mode: "Kioto → Namba + Nankai Koya + funicular", time: "~2h45" },
    { from: 4, to: 5, mode: "Baja a Osaka + Thunderbird/shinkansen vía Tsuruga", time: "~5h" },
    { from: 5, to: 6, mode: "Hokuriku Shinkansen directo", time: "~2h30" }
  ];

  const map = L.map('map', { zoomControl: true, scrollWheelZoom: true, attributionControl: true })
    .setView([36.2, 137.5], 6);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap · CartoDB',
    subdomains: 'abcd',
    maxZoom: 18
  }).addTo(map);

  const overlay = document.getElementById('info-overlay');
  const overlayContent = document.getElementById('info-content');
  let hideTimer = null;
  let pinned = false;

  function showInfo(place, isOptional, pin) {
    clearTimeout(hideTimer);
    if (pin) pinned = true;
    const eyebrow = isOptional
      ? `Excursión de día`
      : `Parada ${place.n} de ${stops.length}${place.booked ? ' · reservado' : ''}`;
    const meta = isOptional
      ? `${place.tag || 'Excursión de día'}`
      : `${place.dates}  ·  ${place.nights} ${place.nights === 1 ? 'noche' : 'noches'}`;
    const bookingCta = place.bookingUrl
      ? `<a href="${place.bookingUrl.replace(/&/g, '&amp;')}" target="_blank" rel="noopener" class="info-cta">${place.booked ? 'Ver reserva' : 'Ver hotel'}</a>`
      : '';
    const directionsCta = place.address
      ? `<a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(place.address)}" target="_blank" rel="noopener" class="info-cta">Cómo llegar</a>`
      : '';
    overlayContent.innerHTML = `
      <button class="info-close" aria-label="Cerrar" onclick="closeInfo()">×</button>
      <div class="info-eyebrow">${eyebrow}</div>
      <div class="info-title">${place.name}</div>
      <div class="info-dates">${meta}</div>
      <div class="info-notes">${place.notes}</div>
      <div class="info-todo-title">Qué ver / hacer</div>
      <ul class="info-todo">${place.todo.map(t => `<li>${t}</li>`).join('')}</ul>
      <div class="info-cta-row">${bookingCta}${directionsCta}</div>
    `;
    overlay.classList.add('visible');
  }

  overlay.addEventListener('mouseenter', () => clearTimeout(hideTimer));
  overlay.addEventListener('mouseleave', () => hideInfo(false));
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeInfo(); });

  function hideInfo(immediate) {
    if (pinned && !immediate) return;
    clearTimeout(hideTimer);
    if (immediate) {
      overlay.classList.remove('visible');
    } else {
      hideTimer = setTimeout(() => overlay.classList.remove('visible'), 220);
    }
  }

  function closeInfo() {
    pinned = false;
    hideInfo(true);
  }

  const markerMap = {};
  const stopEls = {};

  stops.forEach((s, i) => {
    const icon = L.divIcon({
      className: '',
      html: `<div class="marker-pin" data-n="${s.n}">${s.n}</div>`,
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });
    const m = L.marker([s.lat, s.lng], { icon }).addTo(map);
    m.on('mouseover', () => showInfo(s, false));
    m.on('mouseout', () => hideInfo(false));
    m.on('click', () => { focusStop(i); showInfo(s, false, true); });
    markerMap[i] = m;
  });

  optionalStops.forEach(o => {
    const icon = L.divIcon({
      className: '',
      html: `<div class="marker-pin optional">${o.label}</div>`,
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });
    const m = L.marker([o.lat, o.lng], { icon }).addTo(map);
    m.on('mouseover', () => showInfo(o, true));
    m.on('mouseout', () => hideInfo(false));
    m.on('click', () => showInfo(o, true, true));
  });

  const routeCoords = stops.map(s => [s.lat, s.lng]);
  L.polyline(routeCoords, {
    color: '#C84A28',
    weight: 2,
    opacity: 0.85,
    dashArray: '6, 8',
    lineCap: 'round',
    lineJoin: 'round'
  }).addTo(map);

  const tl = document.getElementById('timeline');
  const legByFrom = {};
  legs.forEach(l => legByFrom[l.from] = l);

  const sectionTitle = document.createElement('div');
  sectionTitle.className = 'section-title';
  sectionTitle.textContent = 'Ruta';
  tl.appendChild(sectionTitle);

  stops.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'stop';
    el.dataset.i = i;
    const bookedBadge = s.booked
      ? `<span class="booked">reservado</span>`
      : `<span class="booked pending">pendiente</span>`;
    el.innerHTML = `
      <div class="stop-num">${String(s.n).padStart(2, '0')}</div>
      <div class="stop-body">
        <div class="stop-name">${s.name}${bookedBadge}</div>
        <div class="stop-detail">${s.dates}</div>
        <div class="stop-detail" style="margin-top:2px">${s.hotel}</div>
      </div>
      <div class="stop-nights">
        <strong>${s.nights}</strong>
        <small>${s.nights === 1 ? 'noche' : 'noches'}</small>
      </div>
    `;
    el.addEventListener('click', () => { focusStop(i); showInfo(s, false, true); });
    el.addEventListener('mouseenter', () => showInfo(s, false));
    el.addEventListener('mouseleave', () => hideInfo(false));
    tl.appendChild(el);
    stopEls[i] = el;

    const leg = legByFrom[s.n];
    if (leg) {
      const legEl = document.createElement('div');
      legEl.className = 'leg';
      legEl.innerHTML = `
        <div class="leg-icon">↓</div>
        <div>${leg.mode}</div>
        <div>${leg.time}</div>
      `;
      tl.appendChild(legEl);
    }
  });

  // Optional stops section
  const optSection = document.createElement('div');
  optSection.className = 'section-title';
  optSection.textContent = 'Excursiones de día';
  optSection.style.marginTop = '20px';
  tl.appendChild(optSection);

  optionalStops.forEach(o => {
    const el = document.createElement('div');
    el.className = 'stop';
    el.style.opacity = '0.75';
    el.innerHTML = `
      <div class="stop-num" style="font-style:italic">${o.label}</div>
      <div class="stop-body">
        <div class="stop-name" style="font-style:italic">${o.name}</div>
        <div class="stop-detail">${o.tag || 'Excursión de día'}</div>
      </div>
      <div class="stop-nights">
        <strong style="color:var(--muted);font-style:italic">?</strong>
      </div>
    `;
    el.addEventListener('click', () => showInfo(o, true, true));
    el.addEventListener('mouseenter', () => showInfo(o, true));
    el.addEventListener('mouseleave', () => hideInfo(false));
    tl.appendChild(el);
  });

  let currentIndex = 0;

  function focusStop(i) {
    currentIndex = i;
    Object.values(stopEls).forEach(el => el.classList.remove('active'));
    stopEls[i].classList.add('active');
    document.querySelectorAll('.marker-pin').forEach(el => el.classList.remove('active'));
    const s = stops[i];
    map.flyTo([s.lat, s.lng], 10, { duration: 1.2 });
    setTimeout(() => {
      const pin = document.querySelector(`.marker-pin[data-n="${s.n}"]`);
      if (pin) pin.classList.add('active');
    }, 100);
    stopEls[i].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      focusStop(Math.min(currentIndex + 1, stops.length - 1));
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      focusStop(Math.max(currentIndex - 1, 0));
    } else if (e.key === 'Escape') {
      closeInfo();
    }
    checkKonami(e.key);
  });

  // Easter egg: código Konami → fuegos artificiales (hanabi)
  const konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
  let konamiIndex = 0;
  function checkKonami(key) {
    const expected = konamiCode[konamiIndex];
    const match = expected.length === 1 ? key.toLowerCase() === expected : key === expected;
    if (match) {
      konamiIndex++;
      if (konamiIndex === konamiCode.length) {
        konamiIndex = 0;
        triggerFireworks();
      }
    } else {
      konamiIndex = (key === konamiCode[0]) ? 1 : 0;
    }
  }

  function spawnFirework(x, y) {
    const colors = ['#C84A28', '#5E6B3D', '#1B1F2A', '#D4AF37'];
    for (let i = 0; i < 24; i++) {
      const p = document.createElement('div');
      p.className = 'firework-particle';
      const angle = (i / 24) * 2 * Math.PI;
      const dist = 60 + Math.random() * 80;
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1000);
    }
  }

  function triggerFireworks() {
    for (let b = 0; b < 4; b++) {
      setTimeout(() => {
        const x = 100 + Math.random() * (window.innerWidth - 200);
        const y = 100 + Math.random() * (window.innerHeight * 0.5);
        spawnFirework(x, y);
      }, b * 300);
    }
  }

  document.getElementById('lastupdate').textContent = new Date().toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' }).toLowerCase();
  document.getElementById('stat-booked').textContent = stops.filter(s => s.booked).length;
  document.getElementById('stat-bases').textContent = stops.length;
  document.getElementById('stat-nights').textContent = stops.reduce((a, s) => a + s.nights, 0);

  // Cuenta atrás hasta el viaje
  const tripStart = new Date('2026-10-03T00:00:00+09:00');
  const tripEnd = new Date('2026-10-17T23:59:59+09:00');
  const now = new Date();
  const countdownEl = document.getElementById('countdown');
  if (now < tripStart) {
    const days = Math.ceil((tripStart - now) / 86400000);
    countdownEl.textContent = `Faltan ${days} días`;
  } else if (now <= tripEnd) {
    const dayNum = Math.floor((now - tripStart) / 86400000) + 1;
    countdownEl.textContent = `Día ${dayNum} de 15 · ¡en Japón!`;
  } else {
    countdownEl.textContent = `Viaje completado`;
  }

  // Hojas de arce cayendo (koyo, el otoño japonés)
  const leavesContainer = document.getElementById('leaves');
  const leafGlyphs = ['🍁', '🍂'];
  for (let i = 0; i < 14; i++) {
    const leaf = document.createElement('span');
    leaf.className = 'leaf';
    leaf.textContent = leafGlyphs[Math.floor(Math.random() * leafGlyphs.length)];
    const duration = 14 + Math.random() * 12;
    const delay = Math.random() * duration;
    const drift = Math.round(Math.random() * 100 - 50) + 'px';
    leaf.style.left = (Math.random() * 100) + 'vw';
    leaf.style.fontSize = (14 + Math.random() * 12) + 'px';
    leaf.style.animationDuration = duration + 's';
    leaf.style.animationDelay = '-' + delay + 's';
    leaf.style.setProperty('--drift', drift);
    leavesContainer.appendChild(leaf);
  }
</script>

</body>
</html>
